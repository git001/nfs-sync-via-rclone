# rclone.conf — Example configuration for nfs-sync (Azure Blob backend)
#
# Place this at /etc/rclone/rclone.conf (root-owned, 0600) or pass
# via --config /path/to/this/file in the systemd unit.
#
# nfs-sync.sh works with any rclone backend. This file is an Azure Blob
# example; replace or extend with S3, GCS, B2, SFTP, etc. as needed.
# Set DST= in /etc/default/nfs-sync to match the remote name below.
#
# Authentication options below — pick ONE per remote and delete the others.
# For Production we strongly recommend Managed Identity (no secrets on disk).

[azureblob]
type = azureblob
account = REPLACE_WITH_STORAGE_ACCOUNT_NAME

# --- Auth: Managed Identity (recommended on Azure VMs / AKS) ---
use_msi = true
# msi_object_id = ...                # optional, only if multiple MIs assigned
# msi_client_id = ...

# --- Auth: Service Principal (Entra ID app registration) ---
# client_id = REPLACE
# client_secret = REPLACE
# tenant = REPLACE_TENANT_GUID

# --- Auth: Storage Account Key (least preferred — secret on disk) ---
# key = BASE64_ACCOUNT_KEY

# --- Auth: SAS token (time-limited, OK for testing) ---
# sas_url = https://<account>.blob.core.windows.net/<container>?<sas>

# Tuning for high-volume sync.
# chunk_size: max 100 MiB for block blobs; bigger = fewer PUTs but more memory.
chunk_size = 64M
# upload_concurrency: parallel chunks PER FILE (in addition to --transfers).
upload_concurrency = 16
# Disable checksum mismatch warnings on attribute-cache races.
no_check_container = true

# --- NFS Source (local filesystem path, no real "remote" needed) ---
# We don't define an [nfs] section because rclone reads local paths
# directly. The sync command takes the mount path as src argument.
