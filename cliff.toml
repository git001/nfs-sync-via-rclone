[changelog]
header = "# Changelog\n\nAll notable changes to nfs-sync are documented here.\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | upper_first }}

{% for commit in commits %}\
- {{ commit.message | upper_first | trim_end }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/git001/nfs-sync-via-rclone/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
  { message = "^release:", skip = true },
  { message = "^(feat|add)", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^(refactor|clean|tidy|bump)", group = "Changed" },
  { message = "^(doc|docs)", group = "Documentation" },
  { message = ".*", group = "Changed" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
